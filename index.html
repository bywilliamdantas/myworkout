<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Treinos">
<meta name="theme-color" content="#000000">
<meta name="description" content="Organize seus treinos A/B/C, registre carga e repetições, e acompanhe o ciclo na academia.">
<title>Meus Treinos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    /* escala de espaço (4/8) */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

    /* raio */
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-2xl:28px;

    /* dark (default) */
    --bg:#000;
    --surface:#0d0d0d;
    --surface-2:#161616;
    --surface-3:#1c1c1c;
    --card-top:#1b1b1b;
    --card-bottom:#0a0a0a;
    --card-border:rgba(255,255,255,0.07);
    --divider:rgba(255,255,255,0.06);

    --text-primary:#f5f5f5;
    --text-secondary:#a8a8a8;
    --text-muted:#7d7d7d;
    --text-label:#8a8a8a;

    --dot-off:#2a2a2a;
    --dot-future:#3a3a3a;

    --danger:#ff453a;
    --danger-bg:rgba(255,69,58,0.12);
    --danger-border:rgba(255,69,58,0.3);

    --ok:#30d158;
    --ok-bg:rgba(48,209,88,0.14);
    --ok-border:rgba(48,209,88,0.35);

    --info:#3d9dff;
    --info-bg:rgba(61,157,255,0.12);
    --info-border:rgba(61,157,255,0.3);

    --accent:#ff5a1f;
    --accent-soft:rgba(255,90,31,0.12);
    --accent-border:rgba(255,90,31,0.28);
    --accent-on:#0a0a0a;

    --shadow-card:0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    --shadow-sheet:0 -20px 60px rgba(0,0,0,0.6);

    --ease:cubic-bezier(.32,.72,0,1);
  }

  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f4f6;
      --surface:#ffffff;
      --surface-2:#f0f0f3;
      --surface-3:#e8e8ec;
      --card-top:#ffffff;
      --card-bottom:#fafafb;
      --card-border:rgba(0,0,0,0.06);
      --divider:rgba(0,0,0,0.07);

      --text-primary:#0a0a0a;
      --text-secondary:#4a4a4a;
      --text-muted:#767676;
      --text-label:#6a6a6a;

      --dot-off:#e2e2e6;
      --dot-future:#d8d8dc;

      --shadow-card:0 12px 40px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
      --shadow-sheet:0 -20px 60px rgba(0,0,0,0.18);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
    color:var(--text-primary);
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{ width:100%; max-width:430px; padding:var(--s4) var(--s4) var(--s7); }

  svg{ display:block; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }
  input, .stat-num, .sheet-input, .ex-field input, .step-value{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
  }

  /* ---------- sync row ---------- */
  .sync-row{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-muted);
    padding:0 6px var(--s3); min-height:16px;
  }
  .sync-dot{ width:6px;height:6px;border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .sync-dot.ok{background:var(--ok);}
  .sync-dot.err{background:var(--danger);}
  .sync-dot.busy{background:#ffd60a;}
  .sync-row.hidden{visibility:hidden;}
  .sync-retry{
    color:var(--danger); text-decoration:underline; background:none; border:none;
    font-size:11px; padding:0; margin-left:4px; -webkit-appearance:none;
  }

  /* ---------- card ---------- */
  .card{
    background:linear-gradient(165deg,var(--card-top),var(--card-bottom) 70%);
    border:1px solid var(--card-border);
    border-radius:var(--r-2xl);
    padding:var(--s5) var(--s4);
    box-shadow:var(--shadow-card);
    margin-bottom:var(--s4);
  }

  /* ---------- banners (fora do hero) ---------- */
  .banners{ display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s4); }
  .banner{
    background:var(--danger-bg); border:1px solid var(--danger-border);
    color:#ff8b83; font-size:12px; padding:10px 14px; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  @media (prefers-color-scheme: light){ .banner{ color:#b3241c; } }
  .banner button{
    background:none;border:none;color:inherit;font-size:12px;font-weight:600;
    text-decoration:underline;-webkit-appearance:none;flex-shrink:0;
  }
  .banner.info{ background:var(--info-bg); border-color:var(--info-border); color:#9cc9ff; }
  @media (prefers-color-scheme: light){ .banner.info{ color:#1a6ec4; } }

  /* ---------- hero ---------- */
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    color:var(--text-label); margin:0 0 var(--s4); text-transform:uppercase;
  }
  .hero-top{ display:flex; align-items:center; gap:var(--s4); margin-bottom:var(--s5); }
  .letter-badge{
    width:76px;height:76px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:800;flex-shrink:0;
    color:var(--accent-on);
    transition:transform .35s var(--ease);
  }
  .letter-badge.pulse{ animation:badgePulse .45s var(--ease); }
  @keyframes badgePulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.14);}
    100%{transform:scale(1);}
  }
  .hero-info .workout-name{ font-size:19px; font-weight:700; margin-bottom:4px; }
  .hero-info .workout-sub{ font-size:12.5px; color:var(--text-muted); }

  .cta-btn{
    width:100%; border:none; border-radius:var(--r-lg);
    padding:16px; font-size:15px; font-weight:700;
    background:var(--accent); color:var(--accent-on);
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s var(--ease), opacity .12s ease;
  }
  .cta-btn:active{ transform:scale(0.98); }
  .cta-btn.done{
    background:var(--ok-bg);
    color:var(--ok);
    border:1px solid var(--ok-border);
  }
  .hero-links{ display:flex; justify-content:center; gap:var(--s5); margin-top:var(--s3); }
  .undo-link{
    display:block; text-align:center;
    font-size:12px; color:var(--text-muted); text-decoration:underline;
    background:none; border:none; padding:0; -webkit-appearance:none;
  }

  /* ---------- stats (card separado, discreto) ---------- */
  .stats-card{
    display:flex; gap:0; padding:0;
    overflow:hidden;
  }
  .stat{
    flex:1; padding:14px 8px;
    text-align:center;
    border-right:1px solid var(--divider);
  }
  .stat:last-child{ border-right:none; }
  .stat .stat-num{
    font-size:22px; font-weight:700; line-height:1;
    transition:color .2s ease;
  }
  .stat.streak .stat-num{ color:var(--accent); }
  .stat .stat-label{
    font-size:10px; color:var(--text-muted); margin-top:6px;
    letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
  }

  /* ---------- section headers ---------- */
  .section-title{
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    color:var(--text-label); text-transform:uppercase;
    margin:0 4px var(--s3);
  }
  .section-title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:0 4px var(--s3);
  }
  .toggle-visibility-btn{
    background:var(--surface-3); border:none; color:var(--text-label);
    font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:20px;
    display:flex; align-items:center; gap:5px; -webkit-appearance:none;
    transition:background .15s ease;
  }
  .toggle-visibility-btn:active{ background:var(--surface-2); }
  .collapsed-note{ text-align:center; color:var(--text-muted); font-size:12.5px; padding:22px 16px; }
  .collapsed-note p{ margin:0; line-height:1.5; }

  /* ---------- workout cards ---------- */
  .workout-card{ padding:var(--s4); }
  .workout-head{
    display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s3);
  }
  .workout-chip{
    width:34px;height:34px;border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:var(--accent-on); flex-shrink:0;
  }
  .workout-title-input{
    flex:1; background:none;
    border:none; border-bottom:1.5px dashed var(--card-border);
    color:var(--text-primary);
    font-size:16px; font-weight:700; padding:4px 2px 6px;
    -webkit-appearance:none; min-width:0;
    transition:border-color .15s ease;
  }
  .workout-title-input:focus{
    outline:none;
    border-bottom:1.5px solid var(--accent);
  }
  .edit-pencil{ color:var(--text-muted); flex-shrink:0; margin-left:-4px; display:flex; }
  .reorder-btns{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .reorder-btn{
    background:var(--surface-3); border:none; color:var(--text-muted);
    width:20px;height:16px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .reorder-btn:disabled{ opacity:0.25; }
  .icon-btn{
    background:var(--surface-3); border:none; color:var(--text-muted);
    width:30px;height:30px;border-radius:50%; font-size:14px;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none; flex-shrink:0;
    transition:background .15s ease;
  }
  .icon-btn:active{ background:var(--surface-2); }

  .exercise-row{
    background:var(--surface-2);
    border:1px solid var(--card-border);
    border-radius:var(--r-md); padding:var(--s3); margin-bottom:10px;
  }
  .ex-row-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ex-name-input{
    flex:1; background:var(--surface-3);
    border:1px solid var(--card-border);
    color:var(--text-primary); font-weight:600;
    border-radius:var(--r-sm); padding:10px 12px; font-size:14px;
    -webkit-appearance:none; min-width:0;
  }
  .progress-btn, .ex-del{
    background:var(--surface-3); border:none; color:var(--text-muted);
    width:34px;height:34px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .progress-btn:disabled{ opacity:0.25; }
  .ex-row-bottom{ display:flex; gap:10px; }
  .ex-field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .ex-field span{
    font-size:9.5px; color:var(--text-muted); letter-spacing:0.05em;
    text-transform:uppercase; padding-left:2px; font-weight:600;
  }
  .ex-field input{
    background:var(--surface-3); border:1px solid var(--card-border);
    color:var(--text-primary); border-radius:var(--r-sm); padding:9px 10px;
    font-size:14px; text-align:center; -webkit-appearance:none; width:100%;
  }
  .rest-note{
    text-align:center; font-size:12.5px; color:var(--text-muted);
    padding:14px 4px 2px;
  }

  /* ---------- empty states ---------- */
  .empty-state{
    text-align:center; padding:var(--s5) var(--s3);
    border:1px dashed var(--card-border); border-radius:var(--r-md);
  }
  .empty-state .empty-icon{
    width:36px;height:36px;border-radius:50%;
    background:var(--surface-3); margin:0 auto var(--s3);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
  }
  .empty-state .empty-title{
    font-size:13px; font-weight:600; color:var(--text-secondary);
    margin:0 0 4px;
  }
  .empty-state .empty-sub{
    font-size:11.5px; color:var(--text-muted);
    margin:0; line-height:1.5;
  }

  .add-exercise-btn{
    width:100%; background:var(--surface-2);
    border:1px dashed var(--card-border);
    color:var(--text-label); font-size:12.5px; font-weight:600;
    border-radius:var(--r-sm); padding:10px; margin-top:6px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-exercise-btn:active{ background:var(--surface-3); }

  .add-workout-btn{
    width:100%; background:var(--surface-2);
    border:1px dashed var(--card-border);
    color:var(--text-label); font-size:13px; font-weight:600;
    border-radius:var(--r-lg); padding:16px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-workout-btn:active{ background:var(--surface-3); }

  /* ---------- calendário ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:var(--s5); }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-label); }
  .legend-dot{ width:9px;height:9px;border-radius:50%; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s3); }
  .cal-month-label{ font-size:15px; font-weight:700; text-transform:capitalize; }
  .cal-nav{
    background:var(--surface-3); border:none; color:var(--text-primary);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .cal-nav:disabled{ opacity:0.25; }
  .cal-nav:active{ background:var(--surface-2); }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .cal-weekdays span{ text-align:center; font-size:10px; color:var(--text-muted); font-weight:600; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell{
    aspect-ratio:1; border-radius:var(--r-sm); border:none;
    background:var(--dot-off); color:var(--text-label);
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; -webkit-appearance:none;
    transition:transform .12s var(--ease);
  }
  .cal-cell.filled{ font-weight:700; }
  .cal-cell.empty, .cal-cell.future{ background:transparent; pointer-events:none; }
  .cal-cell.future{ color:var(--text-muted); opacity:0.45; }
  .cal-cell.today{ box-shadow:0 0 0 1.6px var(--text-primary); }
  .cal-cell:active:not(.empty):not(.future){ transform:scale(0.9); }

  /* ---------- reminder toggle (iOS style) ---------- */
  .switch{
    position:relative; display:inline-block;
    width:48px; height:28px; flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .slider{
    position:absolute; inset:0; cursor:pointer;
    background:var(--surface-3); border-radius:28px;
    transition:background .2s ease;
  }
  .switch .slider::before{
    content:""; position:absolute;
    width:22px;height:22px;left:3px;top:3px;
    background:#fff; border-radius:50%;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    transition:transform .2s var(--ease);
  }
  .switch input:checked + .slider{ background:var(--accent); }
  .switch input:checked + .slider::before{ transform:translateX(20px); }

  /* ---------- footer ---------- */
  .footer-actions{ display:flex; gap:10px; margin-top:var(--s1); }
  .footer-btn{
    flex:1; background:var(--surface-2);
    border:1px solid var(--card-border); color:var(--text-label);
    font-size:12px; font-weight:600; padding:11px 8px; border-radius:var(--r-md);
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .footer-btn:active{ background:var(--surface-3); }
  .footer-btn.danger{
    color:var(--danger); border-color:var(--danger-border); background:var(--danger-bg);
    flex:none; padding:11px 14px;
  }
  input[type=file]{ display:none; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-3); border:1px solid var(--card-border);
    color:var(--text-primary); font-size:13px; padding:11px 18px;
    border-radius:var(--r-md); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    max-width:85vw; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

  .hint{ text-align:center; font-size:11px; color:var(--text-muted); margin-top:var(--s4); }
  .loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:60px 0; }

  /* ---------- bottom sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:90; animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:91;
    max-width:430px; margin:0 auto;
    background:linear-gradient(180deg,var(--card-top),var(--card-bottom) 80%);
    border:1px solid var(--card-border); border-bottom:none;
    border-radius:var(--r-2xl) var(--r-2xl) 0 0;
    padding:10px var(--s4) calc(20px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
    box-shadow:var(--shadow-sheet);
    animation:slideUp .24s var(--ease);
    will-change:transform;
  }
  @keyframes slideUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet-handle{
    width:36px; height:4px; border-radius:2px;
    background:var(--card-border);
    margin:2px auto 14px;
    cursor:grab; touch-action:none;
    position:relative;
  }
  .sheet-handle::after{
    content:""; position:absolute; inset:-14px -40px;
  }
  .sheet.dragging{ animation:none; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s4); }
  .sheet-date{ font-size:17px; font-weight:700; text-transform:capitalize; }
  .sheet-chips{ display:flex; gap:8px; margin-bottom:var(--s4); }
  .chip{
    flex:1; padding:10px; border-radius:var(--r-md); font-weight:800; font-size:14px;
    background:var(--surface-3); border:1px solid var(--card-border);
    color:var(--text-label); -webkit-appearance:none;
  }
  .sheet-exercises{ display:flex; flex-direction:column; gap:10px; margin-bottom:var(--s4); }
  .sheet-ex-row{
    background:var(--surface-2); border:1px solid var(--card-border);
    border-radius:var(--r-md); padding:12px;
  }
  .sheet-ex-name{
    font-size:13.5px; font-weight:700; margin-bottom:4px;
  }
  .sheet-ex-last{
    font-size:11px; color:var(--text-muted); margin-bottom:10px;
  }
  .sheet-sets{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .sheet-set{
    display:flex; align-items:center; gap:8px;
  }
  .sheet-set-num{
    width:24px;height:24px;border-radius:50%;
    background:var(--surface-3); color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:11px; font-weight:700; flex-shrink:0;
    transition:all .2s ease;
  }
  .sheet-set.done .sheet-set-num{
    background:var(--ok); color:#0a0a0a;
  }
  .sheet-set.done .step-btn{ opacity:0.5; }
  .sheet-set-check{
    width:24px;height:24px;border-radius:50%;
    background:var(--surface-3); border:none; color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0; -webkit-appearance:none;
    transition:all .2s ease;
  }
  .sheet-set.done .sheet-set-check{
    background:var(--ok); color:#0a0a0a;
  }
  .step-group{
    flex:1; display:flex; align-items:center; gap:0;
    background:var(--surface-3); border:1px solid var(--card-border);
    border-radius:var(--r-sm); overflow:hidden;
    min-width:0;
  }
  .step-btn{
    width:32px;height:34px;border:none;background:none;
    color:var(--text-primary); font-size:16px; font-weight:600;
    -webkit-appearance:none; flex-shrink:0;
    transition:background .12s ease;
  }
  .step-btn:active{ background:var(--surface-2); }
  .step-btn:disabled{ opacity:0.25; }
  .step-value{
    flex:1; text-align:center;
    font-size:13px; font-weight:700;
    padding:0 2px;
    min-width:0;
  }
  .step-unit{
    font-size:9.5px; color:var(--text-muted); font-weight:600;
    padding-right:6px;
  }
  .add-set-btn{
    width:100%; background:none; border:1px dashed var(--card-border);
    color:var(--text-muted); font-size:11.5px; font-weight:600;
    padding:8px; border-radius:var(--r-sm);
    -webkit-appearance:none;
  }
  .sheet-empty{ text-align:center; font-size:12.5px; color:var(--text-muted); padding:18px 10px; margin-bottom:var(--s3); }
  .sheet-actions{ display:flex; flex-direction:column; gap:10px; }

  /* ---------- rest timer ---------- */
  .rest-timer{
    position:fixed; left:0; right:0; bottom:0; z-index:95;
    max-width:430px; margin:0 auto;
    background:var(--surface-3); border-top:1px solid var(--card-border);
    padding:12px var(--s4) calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px;
    box-shadow:0 -10px 30px rgba(0,0,0,0.4);
    animation:slideUp .22s var(--ease);
    transform:translateY(0);
  }
  .rest-timer.hidden{ display:none; }
  .rest-ring{
    width:44px;height:44px;flex-shrink:0;
    position:relative;
  }
  .rest-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .rest-ring .ring-bg{ fill:none; stroke:var(--card-border); stroke-width:3; }
  .rest-ring .ring-fg{
    fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round;
    transition:stroke-dashoffset .9s linear;
  }
  .rest-info{ flex:1; min-width:0; }
  .rest-label{ font-size:10.5px; color:var(--text-muted); letter-spacing:0.05em; text-transform:uppercase; font-weight:600; }
  .rest-time{ font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rest-btn{
    background:var(--surface-2); border:1px solid var(--card-border);
    color:var(--text-primary); font-size:12px; font-weight:600;
    padding:8px 12px; border-radius:var(--r-sm);
    -webkit-appearance:none; flex-shrink:0;
  }
  .rest-btn.primary{ background:var(--accent); color:var(--accent-on); border-color:transparent; }

  /* ---------- progress sheet ---------- */
  .progress-list{ display:flex; flex-direction:column; gap:2px; margin-top:var(--s4); max-height:220px; overflow-y:auto; }
  .progress-row{
    display:flex; justify-content:space-between; gap:8px;
    font-size:12.5px; color:var(--text-label);
    padding:8px 4px; border-bottom:1px solid var(--divider);
  }
  .progress-row span:first-child{ color:var(--text-muted); width:44px; flex-shrink:0; }
  .chart-wrap{ margin:0 -4px; }

  /* ---------- lembretes ---------- */
  .reminder-row{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; gap:12px; }
  .reminder-time-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color:var(--text-muted);
    padding-top:12px; margin-top:12px; border-top:1px solid var(--divider);
  }
  .reminder-time-row input[type=time]{
    background:var(--surface-3); border:1px solid var(--card-border);
    color:var(--text-primary); border-radius:var(--r-sm); padding:7px 9px; font-size:13px;
    -webkit-appearance:none;
  }
  .reminder-note{ font-size:10.5px; color:var(--text-muted); line-height:1.5; margin:14px 0 0; }

  /* ---------- helpers ---------- */
  .hidden{ display:none !important; }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }

  /* ---------- cronômetro do sheet ---------- */
  .sheet-clock{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 14px; margin:-4px 0 16px;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    border-radius:var(--r-md);
    color:var(--accent);
  }
  .sheet-clock .clock-icon{ display:flex; }
  .sheet-clock .clock-time{
    font-size:17px; font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.02em;
  }
  .sheet-clock .clock-label{
    font-size:10.5px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:0.06em; font-weight:600;
  }

  /* ---------- 3 colunas no ex-row-bottom ---------- */
  .ex-row-bottom{ display:flex; gap:8px; }
  .ex-row-bottom .ex-field{ flex:1; min-width:0; }
  .ex-row-bottom .ex-field input{ font-size:13px; padding:8px 6px; }

</style>
</head>
<body>
<div class="screen">
  <div class="sync-row hidden" id="syncRow" title="Seus dados ficam salvos apenas neste navegador/aparelho. Use exportar backup para não perdê-los.">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText"></span>
    <button class="sync-retry" id="syncRetryBtn" style="display:none;">tentar novamente</button>
  </div>

  <div id="app">
    <div class="loading">carregando…</div>
  </div>
</div>

<div id="sheetRoot"></div>
<div id="restTimerRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
