<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Treinos">
<meta name="theme-color" content="#000000">
<meta name="description" content="Organize seus treinos A/B/C, registre carga e repetições, e acompanhe o ciclo na academia.">
<title>Meus Treinos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#000000;
    --card-top:#1b1b1b;
    --card-bottom:#0a0a0a;
    --card-border:rgba(255,255,255,0.06);
    --text-primary:#f5f5f5;
    --text-muted:#7d7d7d;
    --text-label:#8a8a8a;
    --dot-off:#333333;
    --dot-future:#3a3a3a;
    --danger:#ff453a;
    --ok:#30d158;
    --info:#3d9dff;
    --accent:#ff5a1f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
    color:var(--text-primary);
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }
  .screen{ width:100%; max-width:430px; padding:20px 18px 50px; }

  .sync-row{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-muted);
    padding:0 6px 10px; min-height:16px;
  }
  .sync-dot{ width:6px;height:6px;border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .sync-dot.ok{background:var(--ok);}
  .sync-dot.err{background:var(--danger);}
  .sync-dot.busy{background:#ffd60a;}
  .sync-row.hidden{visibility:hidden;}
  .sync-retry{
    color:var(--danger); text-decoration:underline; background:none; border:none;
    font-size:11px; padding:0; margin-left:4px; -webkit-appearance:none;
  }

  .card{
    background:linear-gradient(165deg,var(--card-top),var(--card-bottom) 70%);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:26px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    margin-bottom:18px;
  }

  svg{ display:block; }

  /* ---------- hero ---------- */
  .eyebrow{
    font-size:13px; font-weight:600; letter-spacing:0.06em;
    color:var(--text-label); margin:0 0 14px;
  }
  .hero-top{ display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .letter-badge{
    width:76px;height:76px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:800;flex-shrink:0;
    color:#0a0a0a;
  }
  .hero-info .workout-name{ font-size:19px; font-weight:700; margin-bottom:4px; }
  .hero-info .workout-sub{ font-size:12.5px; color:var(--text-muted); }

  .stats-row{ display:flex; gap:10px; margin-bottom:20px; }
  .stat{
    flex:1; background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:14px; padding:10px 12px;
  }
  .stat.highlight{ background:rgba(255,90,31,0.1); border-color:rgba(255,90,31,0.25); }
  .stat .stat-num{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat.highlight .stat-num{ color:var(--accent); }
  .stat .stat-label{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }

  .cta-btn{
    width:100%; border:none; border-radius:16px;
    padding:16px; font-size:15px; font-weight:700;
    background:var(--accent); color:#0a0a0a;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .cta-btn:active{ transform:scale(0.98); }
  .cta-btn.done{
    background:rgba(48,209,88,0.14);
    color:var(--ok);
    border:1px solid rgba(48,209,88,0.35);
  }
  .hero-links{ display:flex; justify-content:center; gap:18px; margin-top:10px; }
  .undo-link{
    display:block; text-align:center;
    font-size:12px; color:var(--text-muted); text-decoration:underline;
    background:none; border:none; padding:0; -webkit-appearance:none;
  }

  /* ---------- section headers ---------- */
  .section-title{
    font-size:13px; font-weight:700; letter-spacing:0.05em;
    color:var(--text-label); text-transform:uppercase;
    margin:0 4px 12px;
  }

  /* ---------- banners ---------- */
  .banner{
    background:rgba(255,69,58,0.12); border:1px solid rgba(255,69,58,0.3);
    color:#ff8b83; font-size:12px; padding:10px 14px; border-radius:12px;
    margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .banner button{
    background:none;border:none;color:#ff8b83;font-size:12px;font-weight:600;
    text-decoration:underline;-webkit-appearance:none;flex-shrink:0;
  }
  .banner.info{
    background:rgba(61,157,255,0.12); border:1px solid rgba(61,157,255,0.3); color:#9cc9ff;
  }
  .banner.info button{ color:#9cc9ff; }

  /* ---------- workout cards ---------- */
  .workout-card{ padding:20px; }
  .workout-head{
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .workout-chip{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:#0a0a0a; flex-shrink:0;
  }
  .workout-title-input{
    flex:1; background:none;
    border:none; border-bottom:1.5px dashed rgba(255,255,255,0.16);
    color:var(--text-primary);
    font-size:16px; font-weight:700; padding:4px 2px 6px;
    -webkit-appearance:none; min-width:0;
    transition:border-color .15s ease;
  }
  .workout-title-input:focus{
    outline:none;
    border-bottom:1.5px solid var(--accent);
  }
  .edit-pencil{ color:var(--text-muted); flex-shrink:0; margin-left:-4px; display:flex; }
  .reorder-btns{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .reorder-btn{
    background:rgba(255,255,255,0.05); border:none; color:var(--text-muted);
    width:20px;height:16px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .reorder-btn:disabled{ opacity:0.25; }
  .icon-btn{
    background:rgba(255,255,255,0.05); border:none; color:var(--text-muted);
    width:30px;height:30px;border-radius:50%; font-size:14px;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none; flex-shrink:0;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.12); }

  .exercise-row{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:14px; padding:12px; margin-bottom:10px;
  }
  .ex-row-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ex-name-input{
    flex:1; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.06);
    color:var(--text-primary); font-weight:600;
    border-radius:10px; padding:10px 12px; font-size:14px;
    -webkit-appearance:none; min-width:0;
  }
  .progress-btn, .ex-del{
    background:rgba(255,255,255,0.05); border:none; color:var(--text-muted);
    width:34px;height:34px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .progress-btn:disabled{ opacity:0.25; }
  .ex-row-bottom{ display:flex; gap:10px; }
  .ex-field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .ex-field span{
    font-size:9.5px; color:var(--text-muted); letter-spacing:0.04em;
    text-transform:uppercase; padding-left:2px;
  }
  .ex-field input{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06);
    color:var(--text-primary); border-radius:10px; padding:9px 10px;
    font-size:14px; text-align:center; -webkit-appearance:none; width:100%;
  }
  .rest-note{
    text-align:center; font-size:12.5px; color:var(--text-muted);
    padding:14px 4px 2px;
  }

  .empty-ex{
    text-align:center; font-size:12px; color:var(--text-muted);
    border:1px dashed rgba(255,255,255,0.1); border-radius:12px;
    padding:16px 10px; margin-bottom:6px;
  }

  .add-exercise-btn{
    width:100%; background:rgba(255,255,255,0.04);
    border:1px dashed rgba(255,255,255,0.14);
    color:var(--text-label); font-size:12.5px; font-weight:600;
    border-radius:10px; padding:10px; margin-top:6px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-exercise-btn:active{ background:rgba(255,255,255,0.08); }

  .add-workout-btn{
    width:100%; background:rgba(255,255,255,0.03);
    border:1px dashed rgba(255,255,255,0.12);
    color:var(--text-label); font-size:13px; font-weight:600;
    border-radius:16px; padding:16px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-workout-btn:active{ background:rgba(255,255,255,0.07); }

  /* ---------- history heatmap ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-label); }
  .legend-dot{ width:9px;height:9px;border-radius:50%; }

  .heat-months{ display:flex; gap:3px; margin:0 0 4px 20px; }
  .heat-months span{ width:15px; font-size:9px; color:var(--text-muted); white-space:nowrap; }
  .heat-body{ display:flex; gap:6px; }
  .heat-weekday-labels{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; width:16px; }
  .heat-weekday-labels span{ height:12px; font-size:9px; line-height:12px; color:var(--text-muted); }
  .heat-grid{ display:flex; gap:3px; overflow-x:auto; padding-bottom:4px; }
  .heat-col{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
  .heat-cell{
    width:12px;height:12px;border-radius:3px;
    background:var(--dot-off); border:none; padding:0;
    -webkit-appearance:none; transition:transform .1s ease;
  }
  .heat-cell.off:active{ transform:scale(0.8); }
  .heat-cell.empty{ background:transparent; pointer-events:none; }
  .heat-cell.today{ box-shadow:0 0 0 1.5px rgba(255,255,255,0.6); }

  .footer-actions{ display:flex; gap:10px; margin-top:4px; }
  .footer-btn{
    flex:1; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08); color:var(--text-label);
    font-size:12px; font-weight:600; padding:11px 8px; border-radius:12px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .footer-btn:active{ background:rgba(255,255,255,0.1); }
  .footer-btn.danger{ color:var(--danger); border-color:rgba(255,69,58,0.3); background:rgba(255,69,58,0.08); flex:none; padding:11px 14px; }
  input[type=file]{ display:none; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1c1c1c; border:1px solid rgba(255,255,255,0.1);
    color:var(--text-primary); font-size:13px; padding:11px 18px;
    border-radius:14px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    max-width:85vw; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

  .hint{ text-align:center; font-size:11px; color:var(--text-muted); margin-top:16px; }
  .loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:60px 0; }

  /* ---------- bottom sheet (registro do dia) ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:90; animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:91;
    max-width:430px; margin:0 auto;
    background:linear-gradient(180deg,var(--card-top),var(--card-bottom) 80%);
    border:1px solid var(--card-border); border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:82vh; overflow-y:auto;
    box-shadow:0 -20px 60px rgba(0,0,0,0.6);
    animation:slideUp .22s cubic-bezier(.32,.72,0,1);
  }
  @keyframes slideUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,0.16); margin:2px auto 14px; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-date{ font-size:17px; font-weight:700; text-transform:capitalize; }
  .sheet-chips{ display:flex; gap:8px; margin-bottom:18px; }
  .chip{
    flex:1; padding:10px; border-radius:12px; font-weight:800; font-size:14px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    color:var(--text-label); -webkit-appearance:none;
  }
  .sheet-exercises{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .sheet-ex-row{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.05);
    border-radius:14px; padding:10px 12px;
  }
  .sheet-ex-name{ font-size:13.5px; font-weight:600; margin-bottom:8px; }
  .sheet-ex-inputs{ display:flex; gap:8px; }
  .sheet-input{
    flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    color:var(--text-primary); border-radius:10px; padding:9px 10px; font-size:13px;
    -webkit-appearance:none; min-width:0;
  }
  .sheet-empty{ text-align:center; font-size:12.5px; color:var(--text-muted); padding:18px 10px; margin-bottom:14px; }
  .sheet-actions{ display:flex; flex-direction:column; gap:10px; }

  /* ---------- celebração ao concluir ---------- */
  @keyframes celebrate{ 0%{transform:scale(1);} 35%{transform:scale(1.015);} 100%{transform:scale(1);} }
  .card.celebrate{
    animation:celebrate .5s ease;
    box-shadow:0 0 0 2px rgba(48,209,88,0.45), 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* ---------- progresso por exercício ---------- */
  .progress-list{ display:flex; flex-direction:column; gap:2px; margin-top:14px; max-height:200px; overflow-y:auto; }
  .progress-row{
    display:flex; justify-content:space-between; gap:8px;
    font-size:12.5px; color:var(--text-label);
    padding:8px 4px; border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .progress-row span:first-child{ color:var(--text-muted); width:44px; flex-shrink:0; }

  /* ---------- lembretes ---------- */
  .reminder-row{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; }
  .reminder-row input[type=checkbox]{ width:22px;height:22px; accent-color:var(--accent); }
  .reminder-time-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color:var(--text-muted);
    padding-top:12px; margin-top:10px; border-top:1px solid rgba(255,255,255,0.06);
  }
  .reminder-time-row input[type=time]{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    color:var(--text-primary); border-radius:8px; padding:7px 9px; font-size:13px;
    -webkit-appearance:none;
  }
  .reminder-note{ font-size:10.5px; color:var(--text-muted); line-height:1.5; margin:14px 0 0; }
</style>
</head>
<body>
<div class="screen">
  <div class="sync-row hidden" id="syncRow" title="Seus dados ficam salvos apenas neste navegador/aparelho. Use exportar backup para não perdê-los.">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText"></span>
    <button class="sync-retry" id="syncRetryBtn" style="display:none;">tentar novamente</button>
  </div>

  <div id="app">
    <div class="loading">carregando…</div>
  </div>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
