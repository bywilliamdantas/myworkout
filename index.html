<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<meta name="description" content="Organize seus treinos A/B/C, registre carga e repetições, e acompanhe o ciclo na academia.">
<title>Meus Treinos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="apple-touch-startup-image" href="icons/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<script>
  (function(){
    try {
      const t = localStorage.getItem("gym-theme");
      if(t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch(e){}
  })();
</script>
<style>
  :root{
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-2xl:28px;

    --bg:#f7f7f9;
    --bg-decor-top:#ffd9c2;
    --bg-decor-bottom:#ffd0b8;

    --surface:#ffffff;
    --surface-2:#ffffff;
    --surface-3:#f2f2f5;
    --card-top:#ffffff;
    --card-bottom:#ffffff;
    --card-border:rgba(0,0,0,0.06);
    --divider:rgba(0,0,0,0.06);

    --text-primary:#111114;
    --text-secondary:#5a5a63;
    --text-muted:#8e8e97;
    --text-label:#6a6a72;

    --dot-off:#e8e8ee;
    --dot-future:#dcdce2;

    --danger:#ff3b30;
    --danger-bg:rgba(255,59,48,0.10);
    --danger-border:rgba(255,59,48,0.28);

    --ok:#30b857;
    --ok-bg:rgba(48,184,87,0.12);
    --ok-border:rgba(48,184,87,0.32);

    --info:#2f7fe0;
    --info-bg:rgba(47,127,224,0.10);
    --info-border:rgba(47,127,224,0.28);

    --accent:#ff5a1f;
    --accent-2:#ff8a3d;
    --accent-soft:rgba(255,90,31,0.10);
    --accent-border:rgba(255,90,31,0.24);
    --accent-on:#ffffff;

    --shadow-card:0 8px 24px rgba(17,17,20,0.06), 0 2px 6px rgba(17,17,20,0.04);
    --shadow-sheet:0 -20px 60px rgba(0,0,0,0.18);
    --shadow-accent:0 10px 22px rgba(255,90,31,0.28);

    --ease:cubic-bezier(.32,.72,0,1);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000;
      --bg-decor-top:#3a1608;
      --bg-decor-bottom:#2a1006;
      --surface:#0d0d0d;
      --surface-2:#161616;
      --surface-3:#1c1c1c;
      --card-top:#1b1b1b;
      --card-bottom:#0a0a0a;
      --card-border:rgba(255,255,255,0.07);
      --divider:rgba(255,255,255,0.06);
      --text-primary:#f5f5f5;
      --text-secondary:#a8a8a8;
      --text-muted:#7d7d7d;
      --text-label:#8a8a8a;
      --dot-off:#2a2a2a;
      --dot-future:#3a3a3a;
      --shadow-card:0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
      --shadow-sheet:0 -20px 60px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000;
    --bg-decor-top:#3a1608;
    --bg-decor-bottom:#2a1006;
    --surface:#0d0d0d;
    --surface-2:#161616;
    --surface-3:#1c1c1c;
    --card-top:#1b1b1b;
    --card-bottom:#0a0a0a;
    --card-border:rgba(255,255,255,0.07);
    --divider:rgba(255,255,255,0.06);
    --text-primary:#f5f5f5;
    --text-secondary:#a8a8a8;
    --text-muted:#7d7d7d;
    --text-label:#8a8a8a;
    --dot-off:#2a2a2a;
    --dot-future:#3a3a3a;
    --shadow-card:0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    --shadow-sheet:0 -20px 60px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
    color:var(--text-primary);
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
    position:relative;
  }

  body::before,
  body::after{
    content:"";
    position:fixed;
    width:280px; height:280px;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    background:radial-gradient(circle at 30% 30%, var(--bg-decor-top), transparent 70%);
    opacity:0.9;
    filter:blur(2px);
  }
  body::before{ top:-140px; left:-120px; }
  body::after{ bottom:-140px; right:-120px; background:radial-gradient(circle at 70% 70%, var(--bg-decor-bottom), transparent 70%); }

  .screen{ position:relative; z-index:1; width:100%; max-width:430px; padding:var(--s4) var(--s4) var(--s7); }

  svg{ display:block; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }
  input, .stat-num, .sheet-input, .ex-field input, .step-value{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
  }

  .sync-row{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-muted);
    padding:0 6px var(--s3); min-height:16px;
  }
  .sync-dot{ width:6px;height:6px;border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .sync-dot.ok{background:var(--ok);}
  .sync-dot.err{background:var(--danger);}
  .sync-dot.busy{background:#f5b400;}
  .sync-row.hidden{visibility:hidden;}
  .sync-retry{
    color:var(--danger); text-decoration:underline; background:none; border:none;
    font-size:11px; padding:0; margin-left:4px; -webkit-appearance:none;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--card-border);
    border-radius:var(--r-2xl);
    padding:var(--s5) var(--s4);
    box-shadow:var(--shadow-card);
    margin-bottom:var(--s4);
  }

  .banners{ display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s4); }
  .banner{
    background:var(--danger-bg); border:1px solid var(--danger-border);
    color:var(--danger); font-size:12px; padding:10px 14px; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .banner button{
    background:none;border:none;color:inherit;font-size:12px;font-weight:600;
    text-decoration:underline;-webkit-appearance:none;flex-shrink:0;
  }
  .banner.info{ background:var(--info-bg); border-color:var(--info-border); color:var(--info); }

  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    color:var(--text-label); margin:0 0 var(--s4); text-transform:uppercase;
  }

  .hero-head{
    display:flex; align-items:center; gap:var(--s3);
    margin-bottom:var(--s4);
  }
  .hero-head .hero-info{ flex:1; min-width:0; }
  .hero-head .workout-name{ font-size:19px; font-weight:700; margin-bottom:4px; }
  .hero-head .workout-sub{ font-size:12.5px; color:var(--text-muted); }

  .status-btn{
    width:76px;height:76px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0; -webkit-appearance:none; border:none;
    color:#fff; cursor:pointer;
    transition:transform .35s var(--ease), background .25s ease;
    position:relative;
  }
  .status-btn:active{ transform:scale(0.94); }
  .status-btn.pulse{ animation:badgePulse .45s var(--ease); }
  @keyframes badgePulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.14);}
    100%{transform:scale(1);}
  }
  .status-btn svg{ width:34px; height:34px; }
  .status-btn.state-idle{ background:#30b857; }
  .status-btn.state-running{ background:#30b857; }
  .status-btn.state-paused{ background:var(--accent); }

  .hero-clock{
    display:flex; align-items:center; gap:6px;
    padding:6px 10px;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    border-radius:var(--r-sm);
    color:var(--accent);
    flex-shrink:0;
    min-width:78px;
    justify-content:center;
  }
  .hero-clock.paused{
    background:rgba(255,90,31,0.18);
    border-color:rgba(255,90,31,0.5);
  }
  .hero-clock.hidden{ display:none; }
  .hero-clock svg{ width:14px; height:14px; }
  .hero-clock .clock-time{
    font-size:14px; font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.02em;
  }

  .control-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:var(--s3);
  }
  .ctrl-btn{
    padding:14px 8px;
    border-radius:var(--r-md);
    font-size:14px; font-weight:700;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:#fff;
    transition:transform .12s var(--ease), opacity .15s ease;
    border:none;
  }
  .ctrl-btn:active{ transform:scale(0.97); }
  .ctrl-btn:disabled{ opacity:0.35; }
  .ctrl-btn.start{ background:#30b857; color:#fff; box-shadow:0 6px 16px rgba(48,184,87,0.28); }
  .ctrl-btn.start.disabled{ background:var(--surface-3); color:var(--text-muted); box-shadow:none; }
  .ctrl-btn.stop{ background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(255,90,31,0.28); }
  .ctrl-btn.end{ background:#1b1b1e; color:#fff; border:1px solid rgba(255,255,255,0.12); }

  .hero-action-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-top:12px;
  }
  .hero-action{
    padding:10px 6px;
    border-radius:var(--r-md);
    font-size:12px;
    font-weight:700;
    -webkit-appearance:none;
    border:1px solid var(--card-border);
    background:var(--surface-3);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    transition:transform .12s var(--ease), opacity .15s ease;
    color:var(--text-label);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hero-action:active{ transform:scale(0.97); opacity:0.85; }
  .hero-action.edit{ color:var(--info); border-color:var(--info-border); background:var(--info-bg); }
  .hero-action.undo{ color:var(--danger); border-color:var(--danger-border); background:var(--danger-bg); }
  .hero-action.second{ color:var(--accent); border-color:var(--accent-border); background:var(--accent-soft); }

  .stats-card{
    display:flex; gap:0; padding:0;
    overflow:hidden;
  }
  .stat{
    flex:1; padding:14px 8px;
    text-align:center;
    border-right:1px solid var(--divider);
  }
  .stat:last-child{ border-right:none; }
  .stat .stat-num{
    font-size:22px; font-weight:800; line-height:1;
    transition:color .2s ease;
    letter-spacing:-0.01em;
  }
  .stat.streak .stat-num{ color:var(--accent); }
  .stat .stat-label{
    font-size:10px; color:var(--text-muted); margin-top:6px;
    letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
  }

  .section-title{
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    color:var(--text-label); text-transform:uppercase;
    margin:0 4px var(--s3);
  }
  .section-title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:0 4px var(--s3);
  }
  .section-title-row.spaced{ margin-top:24px; }
  .toggle-visibility-btn{
    background:var(--surface-3); border:none; color:var(--text-label);
    font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:20px;
    display:flex; align-items:center; gap:5px; -webkit-appearance:none;
    transition:background .15s ease;
  }
  .toggle-visibility-btn:active{ background:var(--surface-2); }

  .workout-card{ padding:var(--s4); }
  .workout-head{
    display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s3);
  }
  .workout-chip{
    width:34px;height:34px;border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:#fff; flex-shrink:0;
  }
  .workout-title-input{
    flex:1; background:none;
    border:none; border-bottom:1.5px dashed var(--card-border);
    color:var(--text-primary);
    font-size:16px; font-weight:700; padding:4px 2px 6px;
    -webkit-appearance:none; min-width:0;
    transition:border-color .15s ease;
  }
  .workout-title-input:focus{
    outline:none;
    border-bottom:1.5px solid var(--accent);
  }
  .edit-pencil{ color:var(--text-muted); flex-shrink:0; margin-left:-4px; display:flex; }
  .reorder-btns{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .reorder-btn{
    background:var(--surface-3); border:none; color:var(--text-muted);
    width:20px;height:16px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .reorder-btn:disabled{ opacity:0.25; }
  .icon-btn{
    background:var(--surface-3); border:none; color:var(--text-muted);
    width:30px;height:30px;border-radius:50%; font-size:14px;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none; flex-shrink:0;
    transition:background .15s ease;
  }
  .icon-btn:active{ background:var(--surface-2); }

  .exercise-row{
    background:var(--surface-3);
    border:1px solid var(--card-border);
    border-radius:var(--r-md); padding:var(--s3); margin-bottom:10px;
  }
  .ex-row-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ex-name-input{
    flex:1; background:var(--surface);
    border:1px solid var(--card-border);
    color:var(--text-primary); font-weight:600;
    border-radius:var(--r-sm); padding:10px 12px; font-size:14px;
    -webkit-appearance:none; min-width:0;
  }
  .ex-name-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    cursor:pointer; color:var(--text-muted);
  }
  .ex-name-btn .ex-name-text{
    flex:1; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--text-primary);
  }
  .ex-name-btn .ex-name-text.placeholder{ color:var(--text-muted); font-weight:500; }
  .ex-name-btn svg{ flex-shrink:0; }
  .progress-btn, .ex-del{
    background:var(--surface); border:none; color:var(--text-muted);
    width:34px;height:34px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .progress-btn:disabled{ opacity:0.25; }

  .ex-type-toggle{
    display:flex; gap:6px; margin-bottom:10px;
  }
  .ex-type-btn{
    flex:1; padding:8px; border-radius:var(--r-sm);
    background:var(--surface); border:1px solid var(--card-border);
    color:var(--text-label); font-size:12px; font-weight:600;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:all .15s ease;
  }
  .ex-type-btn.active{
    background:var(--accent-soft);
    border-color:var(--accent-border);
    color:var(--accent);
  }

  .ex-row-bottom{ display:flex; gap:8px; }
  .ex-row-bottom .ex-field{ flex:1; min-width:0; }
  .ex-row-bottom .ex-field input{ font-size:13px; padding:8px 6px; }
  .ex-field{ display:flex; flex-direction:column; gap:4px; }
  .ex-field span{
    font-size:9.5px; color:var(--text-muted); letter-spacing:0.05em;
    text-transform:uppercase; padding-left:2px; font-weight:600;
  }
  .ex-field input{
    background:var(--surface); border:1px solid var(--card-border);
    color:var(--text-primary); border-radius:var(--r-sm); padding:9px 10px;
    font-size:14px; text-align:center; -webkit-appearance:none; width:100%;
  }
  .rest-note{
    text-align:center; font-size:12.5px; color:var(--text-muted);
    padding:14px 4px 2px;
  }

  .empty-state{
    text-align:center; padding:var(--s5) var(--s3);
    border:1px dashed var(--card-border); border-radius:var(--r-md);
  }
  .empty-state .empty-icon{
    width:36px;height:36px;border-radius:50%;
    background:var(--surface-3); margin:0 auto var(--s3);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
  }
  .empty-state .empty-title{
    font-size:13px; font-weight:600; color:var(--text-secondary);
    margin:0 0 4px;
  }
  .empty-state .empty-sub{
    font-size:11.5px; color:var(--text-muted);
    margin:0; line-height:1.5;
  }

  .add-exercise-btn{
    width:100%; background:var(--surface-3);
    border:1px dashed var(--card-border);
    color:var(--text-label); font-size:12.5px; font-weight:600;
    border-radius:var(--r-sm); padding:10px; margin-top:6px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-exercise-btn:active{ background:var(--surface-2); }

  .add-workout-btn{
    width:100%; background:var(--surface);
    border:1px dashed var(--card-border);
    color:var(--text-label); font-size:13px; font-weight:600;
    border-radius:var(--r-lg); padding:16px;
    -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:var(--shadow-card);
  }
  .add-workout-btn:active{ background:var(--surface-3); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:var(--s5); }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-label); }
  .legend-dot{ width:9px;height:9px;border-radius:50%; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s3); }
  .cal-month-label{ font-size:15px; font-weight:700; text-transform:capitalize; }
  .cal-nav{
    background:var(--surface-3); border:none; color:var(--text-primary);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;
  }
  .cal-nav:disabled{ opacity:0.25; }
  .cal-nav:active{ background:var(--surface-2); }

  .bars-title{ font-size:12px; font-weight:700; color:var(--text-label); margin:18px 0 10px; }

  .hbar-row{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .hbar-name{ width:92px; flex-shrink:0; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-track{ flex:1; height:8px; background:var(--surface-3); border-radius:6px; overflow:hidden; display:block; }
  .hbar-fill{ display:block; height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); border-radius:6px; }
  .hbar-val{ width:24px; text-align:right; font-weight:700; }
  .vbars{ display:flex; gap:6px; align-items:stretch; height:120px; }
  .vbar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .vbar-track{ flex:1; width:100%; display:flex; align-items:flex-end; background:var(--surface-3); border-radius:6px; overflow:hidden; }
  .vbar-fill{ display:block; width:100%; background:var(--text-muted); }
  .vbar-fill.current{ background:var(--accent); }
  .vbar-label{ font-size:9.5px; color:var(--text-muted); }

  .records-card{ padding:6px 12px; }
  .record-row{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 2px;
    background:none; border:none; border-bottom:1px solid var(--divider);
    color:var(--text-primary); text-align:left; -webkit-appearance:none; font-size:13px;
  }
  .record-row:last-child{ border-bottom:none; }
  .record-ico{ color:var(--accent); display:flex; }
  .record-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .record-w{
    flex-shrink:0; min-width:20px; height:20px; padding:0 6px; border-radius:6px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#fff;
  }
  .record-val{ font-weight:700; }
  .record-date{ color:var(--text-muted); font-size:11px; width:34px; text-align:right; }
  .pr-chips{ display:flex; gap:8px; margin-bottom:12px; }
  .pr-chip{ flex:1; background:var(--surface-3); border:1px solid var(--card-border); border-radius:var(--r-md); padding:10px 12px; }
  .pr-chip span{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-muted); }
  .pr-chip span svg{ color:var(--accent); }
  .pr-chip b{ display:block; margin-top:4px; font-size:15px; }

  .body-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .body-big{ font-size:26px; font-weight:800; letter-spacing:-0.02em; }
  .body-big span{ font-size:13px; color:var(--text-muted); font-weight:600; }
  .body-delta{ font-size:12px; font-weight:700; color:var(--text-muted); }
  .body-measures{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .body-measure{ background:var(--surface-3); border-radius:var(--r-sm); padding:8px 10px; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .body-measure span{ color:var(--text-muted); width:100%; font-size:11px; }
  .body-measure b{ font-size:14px; }
  .body-measure i{ font-style:normal; font-size:11px; color:var(--text-muted); }
  .body-form{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .body-field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .body-field.wide{ grid-column:1 / -1; }
  .body-field span{ font-size:11.5px; color:var(--text-muted); }
  .body-field input{
    background:var(--surface-3); border:1px solid var(--card-border); color:var(--text-primary);
    border-radius:var(--r-sm); padding:11px 12px; font-size:14px; font-family:inherit;
    -webkit-appearance:none; min-width:0; width:100%;
  }
  .body-field input:focus{ outline:none; border-color:var(--accent); }

  .status-pill{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; background:var(--surface-3); color:var(--text-secondary); }
  .status-pill.ok{ background:var(--ok-bg); color:var(--ok); }
  .backup-list{ display:flex; flex-direction:column; gap:8px; }
  .backup-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px;
    background:var(--surface-3); border:1px solid var(--card-border); border-radius:var(--r-md);
  }
  .backup-date{ font-weight:700; font-size:13.5px; }
  .backup-meta{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }

  .screen{ padding-bottom: calc(var(--s4) + 78px + env(safe-area-inset-bottom)); }
  .tab-panel{ animation: tabFadeIn .18s ease; }
  @keyframes tabFadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  .tab-title{
    font-size:26px; font-weight:800; letter-spacing:-0.02em;
    margin:2px 4px 16px;
  }
  .spaced-title{ margin-top:24px; }
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    max-width:430px; margin:0 auto;
    display:flex; justify-content:space-between;
    background:rgba(255,255,255,0.92);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border-top:1px solid var(--card-border);
    padding:8px var(--s3) calc(6px + env(safe-area-inset-bottom));
  }
  :root[data-theme="dark"] .tabbar{ background:rgba(13,13,13,0.92); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabbar{ background:rgba(13,13,13,0.92); } }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-muted);
    padding:4px 2px; -webkit-appearance:none;
  }
  .tab-btn-icon{ display:flex; }
  .tab-btn-label{ font-size:10px; font-weight:600; }
  .tab-btn.active{ color:var(--accent); }

  .greet-row{ display:flex; align-items:center; justify-content:space-between; margin:2px 4px 16px; }
  .greet-hello{ font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  .greet-date{ font-size:13px; color:var(--text-muted); margin-top:2px; text-transform:capitalize; }
  .week-dots-card{ margin-top:14px; }
  .week-dots{ display:flex; justify-content:space-between; gap:4px; }
  .week-dot-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .week-dot-label{ font-size:10px; color:var(--text-muted); font-weight:600; }
  .week-dot{
    width:28px; height:28px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; color:var(--ok);
    border:1.5px solid transparent;
  }
  .week-dot.done{ background:var(--ok-bg); }
  .week-dot.rest{ color:var(--text-muted); }
  .week-dot.today{ border-color:var(--accent); }
  .last-record-card{
    display:flex; align-items:center; gap:12px; margin-top:14px;
    width:100%; text-align:left; -webkit-appearance:none; color:var(--text-primary);
  }
  .lr-title{ display:block; font-size:11px; color:var(--text-muted); font-weight:600; }
  .lr-name{ display:block; font-size:13.5px; font-weight:700; margin-top:2px; }
  .lr-arrow{ color:var(--text-muted); flex-shrink:0; display:flex; }
  .quick-actions{ display:flex; gap:10px; margin-top:14px; }
  .quick-action-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--card-border); border-radius:var(--r-lg);
    padding:14px 8px; color:var(--text-primary); font-size:12px; font-weight:600;
    -webkit-appearance:none;
    box-shadow:var(--shadow-card);
  }
  .quick-action-btn svg{ color:var(--accent); }

  .month-sessions-card{ padding:4px 12px; }
  .month-session-row{
    width:100%; display:flex; align-items:center; gap:12px; padding:12px 2px;
    background:none; border:none; border-bottom:1px solid var(--divider);
    color:var(--text-primary); text-align:left; -webkit-appearance:none;
  }
  .month-session-row:last-child{ border-bottom:none; }
  .ms-date{ font-weight:700; font-size:13.5px; width:42px; flex-shrink:0; }
  .ms-letters{ flex:1; display:flex; gap:6px; }
  .ms-chip{
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#fff;
  }
  .ms-arrow{ color:var(--text-muted); flex-shrink:0; display:flex; }

  /* ---------- login (fiel ao mockup) ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex; flex-direction:column;
    padding:8vh 4px 24px;
    text-align:center;
  }
  .login-logo{
    width:96px; height:96px; margin:0 auto 22px;
    border-radius:26px;
    background:linear-gradient(180deg,#ff8a3d,#ff5a1f);
    box-shadow:0 16px 34px rgba(255,90,31,0.28), inset 0 1px 0 rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .login-logo::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.35), transparent 55%);
    pointer-events:none;
  }
  .login-logo svg{ width:52px; height:52px; position:relative; z-index:1; }
  .login-logo img{
    width:100%; height:100%; object-fit:cover;
    position:absolute; inset:0; z-index:2;
    border-radius:26px;
  }
  :root[data-theme="dark"] .login-title{ color:#f5f5f5; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .login-title{ color:#f5f5f5; } }
  .login-title .accent{ color:var(--accent); }
  .login-sub{
    font-size:15px; color:#8e8e97; margin:10px 0 34px;
    font-weight:500;
  }
  .login-form{
    display:flex; flex-direction:column; gap:14px;
    text-align:left;
    margin-top:6px;
  }
  .login-input-wrap{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border:1.5px solid rgba(0,0,0,0.08);
    border-radius:14px;
    padding:0 16px;
    height:56px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  :root[data-theme="dark"] .login-input-wrap{ border-color:rgba(255,255,255,0.1); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .login-input-wrap{ border-color:rgba(255,255,255,0.1); } }
  .login-input-wrap:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(255,90,31,0.12);
  }
  .login-input-wrap .li-icon{
    color:#8e8e97; display:flex; flex-shrink:0;
  }
  .login-input-wrap input{
    flex:1; min-width:0;
    background:none; border:none; outline:none;
    font-size:15.5px; color:var(--text-primary); font-family:inherit;
    padding:0;
  }
  .login-input-wrap input::placeholder{ color:#a4a4ad; }
  .login-input-wrap .pw-toggle{
    background:none; border:none; color:#8e8e97;
    padding:6px; display:flex; -webkit-appearance:none; cursor:pointer;
  }

  .login-keep-row{
    display:flex; align-items:center; gap:12px;
    margin:6px 2px 4px;
    font-size:14px; color:#5a5a63;
    font-weight:500;
  }
  :root[data-theme="dark"] .login-keep-row{ color:#a8a8a8; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .login-keep-row{ color:#a8a8a8; } }
  .switch.lg{ width:52px; height:30px; }
  .switch.lg .slider::before{ width:24px; height:24px; left:3px; top:3px; }
  .switch.lg input:checked + .slider::before{ transform:translateX(22px); }

  .login-error{
    color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger-border);
    border-radius:12px; padding:11px 14px; font-size:13px; margin-top:2px;
    text-align:center;
  }

  .cta-btn{
    width:100%;
    background:linear-gradient(180deg,#ff8a3d,#ff5a1f);
    color:#fff; border:none;
    height:56px; border-radius:16px;
    font-size:16px; font-weight:800;
    letter-spacing:0.01em;
    -webkit-appearance:none;
    box-shadow:0 12px 24px rgba(255,90,31,0.32);
    transition:transform .12s var(--ease), opacity .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    margin-top:12px;
  }
  .cta-btn:active{ transform:scale(0.98); }
  .cta-btn:disabled{ opacity:0.6; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
